; PlatformIO Project Configuration File
; NeuroSocks ESP32 - ML Inference + BLE
; Target: ESP32-WROOM-32
; Purpose: Read sensors → Feature engineering → ML inference → Send BLE packets

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build optimization
build_flags = 
    -O2
    -std=c++17
    -Wall
    -fmax-errors=5

; Library dependencies
lib_deps =

; Monitor settings
monitor_speed = 115200
monitor_filters = 
    colorize
    log2file

; Upload settings
upload_speed = 921600
upload_port = COM6